# Continue the official-GenDeg-initialized 512px run from epoch 5 to epoch 30.
# Keep milestone checkpoints at epochs 10/15/20/25/30 for reproducible
# qualitative evaluation while retaining a resumable rolling checkpoint.
lightning:
  modelcheckpoint:
    params:
      filename: "epoch-{epoch:06}"
      save_weights_only: false
      save_last: true
      save_top_k: -1
      every_n_epochs: 5
      save_on_train_epoch_end: true
  callbacks:
    image_logger:
      params:
        # 512px validation preview uses a legacy 32x32 latent shape and fails
        # against the 64x64 image condition. Milestone inference is handled by
        # dedicated 512px scripts instead.
        disabled: true
  trainer:
    gpus: "0"
    precision: 16
    max_steps: -1
    max_epochs: 30
    accumulate_grad_batches: 128
    gradient_clip_val: 1.0
    gradient_clip_algorithm: norm
    benchmark: true
    check_val_every_n_epoch: 1
    num_sanity_val_steps: 0
    limit_val_batches: 1
