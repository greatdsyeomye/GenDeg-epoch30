model:
  base_learning_rate: 1.0e-06
  target: ldm.models.diffusion.ddpm_edit.LatentDiffusion
  params:
    ckpt_path: gendeg.ckpt
    linear_start: 0.00085
    linear_end: 0.012
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: edited
    cond_stage_key: edit
    image_size: 32
    channels: 4
    cond_stage_trainable: false
    conditioning_key: hybrid
    monitor: null
    scale_factor: 0.18215
    use_ema: true
    load_ema: false
    scheduler_config:
      target: ldm.lr_scheduler.LambdaLinearScheduler
      params:
        warm_up_steps:
        - 0
        cycle_lengths:
        - 10000000000000
        f_start:
        - 1.0e-06
        f_max:
        - 1.0
        f_min:
        - 1.0
    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 32
        in_channels: 8
        out_channels: 4
        model_channels: 320
        attention_resolutions:
        - 4
        - 2
        - 1
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 4
        - 4
        num_heads: 8
        use_spatial_transformer: true
        transformer_depth: 1
        context_dim: 768
        use_checkpoint: true
        legacy: false
    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity
    cond_stage_config:
      target: ldm.modules.encoders.modules.FrozenCLIPEmbedder
    residual_diffusion: false
    composite_condition_config:
      degradation_types:
      - low_light
      - haze
      - rain
      - snow
      parameter_dim: 2
      hidden_dim: 256
      context_dim: 768
      num_subtypes: 5
      stats_only: true
      zero_gate: true
    composite_condition_injection: additive
data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 2
    train:
      target: composite_dataset.CompositeDatasetMixture
      params:
        path: data
        split: train
        min_resize_res: 256
        max_resize_res: 256
        crop_res: 256
        flip_prob: 0.5
        replace_dir: /data/
        sampling: weighted
        datasets:
        - target: composite_dataset.CDD11CompositeDataset
          params:
            root: data/cdd11/train
            resolution: 512
            resize_mode: center_crop
            flip_probability: 0.5
            identity_probability: 0.05
            prompt_mode: atomic
            categories:
            - low
        - target: composite_dataset.CDD11CompositeDataset
          params:
            root: data/cdd11/train
            resolution: 512
            resize_mode: center_crop
            flip_probability: 0.5
            identity_probability: 0.05
            prompt_mode: atomic
            categories:
            - low_haze
            - low_rain
            - low_snow
            - low_haze_rain
            - low_haze_snow
        - target: composite_dataset.CDD11CompositeDataset
          params:
            root: data/cdd11/train
            resolution: 512
            resize_mode: center_crop
            flip_probability: 0.5
            identity_probability: 0.05
            prompt_mode: atomic
            categories:
            - haze
            - rain
            - snow
            - haze_rain
            - haze_snow
        - target: composite_dataset.ManifestCompositeDataset
          params:
            manifest: data/manifests/allweathernight_train.jsonl
            root: data/allweathernight
            resolution: 512
            resize_mode: center_crop
            flip_probability: 0.5
            identity_probability: 0.05
            dataset_name: allweathernight
        - target: composite_dataset.ManifestCompositeDataset
          params:
            manifest: data/manifests/lcdd_train.jsonl
            root: data/lcdd
            resolution: 512
            resize_mode: center_crop
            flip_probability: 0.5
            identity_probability: 0.05
            dataset_name: lcdd_reproduced
        - target: composite_dataset.ManifestCompositeDataset
          params:
            manifest: data/manifests/weatherbench_train_4098.jsonl
            root: data/weatherbench
            resolution: 512
            resize_mode: center_crop
            flip_probability: 0.5
            identity_probability: 0.05
            dataset_name: weatherbench
        epoch_size: 51363
        seed: 29
        weights:
        - 3549
        - 11830
        - 5915
        - 8000
        - 26252
        - 4098
    validation:
      target: composite_dataset.CDD11CompositeDataset
      params:
        path: data
        split: val
        min_resize_res: 256
        max_resize_res: 256
        crop_res: 256
        root: data/cdd11/test
        resolution: 512
        resize_mode: center_crop
        flip_probability: 0.0
        identity_probability: 0.0
        prompt_mode: atomic
        categories:
        - low_haze
        - low_rain
        - low_snow
        - haze_rain
        - haze_snow
        - low_haze_rain
        - low_haze_snow
        max_clean_images: 7
